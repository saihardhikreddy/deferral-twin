name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [app, features, game, gate_and_media, online, engine]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ffmpeg
        timeout-minutes: 8
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests/test_${{ matrix.suite }}.py
        run: python tests/test_${{ matrix.suite }}.py

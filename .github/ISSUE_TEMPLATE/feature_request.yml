name: Feature request
description: Suggest an idea for the twin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: How it should work. Note any effect on offline use, privacy or the deferral gate.
    validations:
      required: true
